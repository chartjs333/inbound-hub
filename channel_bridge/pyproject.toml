[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "inbound-agent-channel-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "httpx>=0.28,<1", "cryptography>=46,<51", "Pillow>=13,<14", "filelock>=3.18,<5", "uvicorn>=0.34,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1,<3", "build>=1,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
agent_channel_bridge = ["static/*"]

[project.scripts]
inbound-channel-bridge = "agent_channel_bridge.__main__:main"
