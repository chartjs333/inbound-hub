[project]
name = "inbound-hub"
version = "0.1.0"
description = "Universal inbound coordination hub for source adapters and nginx-qa sprint proposals"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.28,<1"
]

[project.scripts]
inbound-hub = "inbound_hub.__main__:main"
inbound-hub-tray = "inbound_hub.tray:main"
inbound-hub-windows = "inbound_hub.windows_service:main"

[project.optional-dependencies]
windows = ["pywin32>=308; sys_platform == 'win32'"]
tray = ["pystray>=0.19,<1", "Pillow>=13,<14"]
dev = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
  "build>=1,<2", "mypy>=1,<3", "jsonschema>=4.23,<5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
